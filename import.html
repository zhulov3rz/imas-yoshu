<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="アイドル名や声優名の一覧から、IM@S 予習リストの出演者をまとめて選択します。"
    />
    <title>出演者をまとめて入力 | IM@S 予習リスト</title>
    <link rel="stylesheet" href="./styles.css?v=20260927-7" />
    <script type="module" src="./import.js?v=20260927-6"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="header-home" href="./" aria-label="トップに戻る">
        <div class="header-inner">
          <p class="eyebrow">CONCERT PREP TOOL</p>
          <h1>IM@S 予習リスト</h1>
          <p class="lede">出演者の一覧を貼り付けて、まとめて選択できます。</p>
        </div>
      </a>
    </header>

    <p id="status" class="load-status" role="status">アイドルデータを読み込んでいます…</p>

    <main id="import-app" class="import-main" hidden>
      <section class="importer" aria-labelledby="import-title">
        <div class="section-heading import-heading">
          <div>
            <p class="step-label">BULK IMPORT</p>
            <h2 id="import-title">出演者をまとめて入力</h2>
          </div>
          <a class="utility-link" href="./">通常の選択に戻る</a>
        </div>

        <p class="import-description">
          アイドル名または声優名を含むテキストを貼り付けてください。改行、読点、カンマなどで区切れます。
          同じ声優が複数のアイドルを担当している場合は、該当する全員を検出します。
        </p>

        <form id="import-form">
          <label class="bulk-input-label" for="bulk-input">出演者情報</label>
          <textarea
            id="bulk-input"
            rows="12"
            placeholder="例：&#10;中村 繪里子&#10;如月 千早&#10;Machico"
          ></textarea>

          <div class="import-actions">
            <p id="import-summary" class="import-summary" aria-live="polite">
              名前を入力すると、検出結果がここに表示されます。
            </p>
            <button id="import-submit" class="primary-button" type="submit" disabled>
              検出したアイドルを選択
            </button>
          </div>
        </form>

        <div id="import-feedback" class="import-feedback" hidden>
          <section aria-labelledby="detected-title">
            <div class="feedback-heading">
              <h3 id="detected-title">検出したアイドル</h3>
              <span id="detected-count">0</span>
            </div>
            <ul id="detected-list" class="detected-list"></ul>
          </section>

          <section id="unmatched-group" class="unmatched-group" aria-labelledby="unmatched-title" hidden>
            <div class="feedback-heading">
              <h3 id="unmatched-title">検出できなかった入力</h3>
              <span id="unmatched-count">0</span>
            </div>
            <ul id="unmatched-list" class="unmatched-list"></ul>
          </section>
        </div>
      </section>
    </main>

    <footer>
      <p>非公式のファンツールです。</p>
    </footer>
  </body>
</html>
