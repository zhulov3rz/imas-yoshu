<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="出演アイドルから、オリジナルメンバーがそろうアイドルマスター楽曲を探します。"
    />
    <title>IM@S 予習リスト</title>
    <link rel="stylesheet" href="./styles.css?v=20261004-2" />
    <script type="module" src="./app.js?v=20261004-2"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-tools">
        <div class="language-switcher" role="group" aria-label="表示言語" data-i18n-aria="languageLabel">
          <button type="button" data-language="ja" aria-pressed="true">日本語</button>
          <button type="button" data-language="en" aria-pressed="false">English</button>
        </div>
      </div>
      <a class="header-home" href="./" aria-label="トップに戻る" data-i18n-aria="homeLabel">
        <div class="header-inner">
          <p class="eyebrow">CONCERT PREP TOOL</p>
          <h1 data-i18n="appTitle">IM@S 予習リスト</h1>
          <p class="lede" data-i18n="lede">
            出演アイドルを選ぶと、オリジナルメンバーがそろう曲と、あと少しでそろう曲を探せます。
          </p>
        </div>
      </a>
    </header>

    <p id="status" class="load-status" role="status" data-i18n="loading">楽曲データを読み込んでいます…</p>

    <main id="app" hidden>
      <section class="picker" aria-labelledby="picker-title">
        <div class="section-heading">
          <div>
            <p class="step-label">STEP 1</p>
            <h2 id="picker-title" data-i18n="pickerTitle">出演アイドルを選ぶ</h2>
          </div>
          <div class="picker-heading-actions">
            <a class="utility-link bulk-import-link" href="./import.html" data-i18n="bulkImport">出演者をまとめて入力</a>
            <span id="visible-count" class="visible-count"></span>
          </div>
        </div>

        <label class="search-box" for="idol-search">
          <span class="visually-hidden" data-i18n="searchLabel">アイドルを検索</span>
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="m21 21-4.35-4.35m2.35-5.15A7.5 7.5 0 1 1 4 11.5a7.5 7.5 0 0 1 15 0Z" />
          </svg>
          <input
            id="idol-search"
            type="search"
            autocomplete="off"
            placeholder="名前・よみ・ローマ字・声優名で検索"
            data-i18n-placeholder="searchPlaceholder"
          />
        </label>

        <div id="brand-filters" class="brand-filters" aria-label="ブランドで絞り込む" data-i18n-aria="brandFilterLabel"></div>
        <div class="idol-filter-options">
          <label class="option-control">
            <input id="hide-unvoiced-idols" type="checkbox" checked />
            <span data-i18n="hideUnvoiced">ボイスなしのアイドルを非表示</span>
          </label>
        </div>
        <div id="idol-grid" class="idol-grid"></div>
      </section>

      <aside id="selected-tray" class="selected-tray" hidden>
        <div class="selected-header">
          <strong><span data-i18n="selectedPrefix">選択中</span> <span id="selected-count">0</span><span data-i18n="peopleSuffix">人</span></strong>
          <button id="clear-selection" class="text-button" type="button" data-i18n="clearSelection">すべて解除</button>
        </div>
        <div id="selected-list" class="selected-list"></div>
        <div class="search-actions">
          <label class="option-control">
            <input id="include-missing-two" type="checkbox" checked />
            <span data-i18n="includeMissingTwo">あと2人の候補も表示</span>
          </label>
          <button id="find-songs" class="primary-button" type="button" disabled>
            <span data-i18n="findSongs">このメンバーで楽曲を探す</span>
          </button>
        </div>
      </aside>

      <section id="results" class="results" aria-labelledby="results-title" hidden>
        <div class="section-heading result-heading">
          <div>
            <p class="step-label">STEP 2</p>
            <h2 id="results-title" data-i18n="resultsTitle">予習する楽曲</h2>
            <p id="result-summary" class="result-summary" aria-live="polite"></p>
          </div>
          <div class="result-heading-actions">
            <button id="export-results" class="export-button" type="button" disabled>
              <span data-i18n="exportResults">JSONを書き出す</span>
            </button>
            <a class="back-link" href="#app" data-i18n="backToSelection">メンバー選択に戻る</a>
          </div>
        </div>
        <div class="result-options">
          <label class="option-control">
            <input id="exclude-solo-songs" type="checkbox" checked />
            <span data-i18n="excludeSoloSongs">ソロ曲を除外</span>
          </label>
          <label class="option-control">
            <input id="compact-results" type="checkbox" />
            <span data-i18n="compactResults">コンパクト表示</span>
          </label>
        </div>
        <div id="result-groups"></div>
      </section>
    </main>

    <footer>
      <p data-i18n="footer">
        非公式のファンツールです。楽曲データは「最初に確認できた録音の歌唱者」を基準に整理しています。
      </p>
    </footer>
  </body>
</html>
